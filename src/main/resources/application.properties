# ===============================
# ?????? ? ?????
# ===============================
spring.config.import=optional:file:.env[.properties]
server.port=8443
# server.http-port=8080  # ??????????? ??? ????????? ? HTTP ?? HTTPS

# ===============================
# HTTPS/SSL ?????????
# ===============================
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=${SERVER_SSL_KEY_STORE:classpath:keystore/quiz-server-keystore.p12}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:ServerPass_1BIB23263}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:makarovServer}
server.ssl.key-password=${SERVER_SSL_KEY_PASSWORD:${SERVER_SSL_KEY_STORE_PASSWORD:ServerPass_1BIB23263}}
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_AES_128_GCM_SHA256

# ===============================
# ????????? ???? ?????? (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/quizdb
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE ?????????
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# LOGGING (???????????)
# ===============================
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# JWT ?????????
# ===============================
jwt.secret=${JWT_SECRET:mySecretKeyForJWTSigningThatIsAtLeast32CharactersLongEnough}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ===============================
# CORS ????????? (???? ?????)
# ===============================
#cors.allowed-origins=https://localhost:3000,http://localhost:3000
#cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
#cors.allowed-headers=*
#cors.allow-credentials=true

# ===============================
# ?????????????? ????????? SPRING
# ===============================
spring.application.name=banking-system
spring.profiles.active=prod
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# ????????? ???? (???????????)
# ===============================
spring.cache.type=simple
spring.cache.cache-names=users,transactions

# ===============================
# ACTUATOR (??????????)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


# ===============================
# Signature Key Configuration (??? ???????? ???????)
# ===============================
signature.key-store-path=${SIGNATURE_KEY_STORE_PATH:${SERVER_SSL_KEY_STORE:classpath:keystore/quiz-server-keystore.p12}}
signature.key-store-type=${SIGNATURE_KEY_STORE_TYPE:PKCS12}
signature.key-store-password=${SIGNATURE_KEYSTORE_PASSWORD:${SERVER_SSL_KEY_STORE_PASSWORD:ServerPass_1BIB23263}}
signature.key-alias=${SIGNATURE_KEY_ALIAS:${SERVER_SSL_KEY_ALIAS:makarovServer}}
signature.key-password=${SIGNATURE_KEY_PASSWORD:${SIGNATURE_KEYSTORE_PASSWORD:${SERVER_SSL_KEY_STORE_PASSWORD:ServerPass_1BIB23263}}}
signature.public-key-base64=${SIGNATURE_PUBLIC_KEY_BASE64:}
signature.algorithm=${SIGNATURE_ALGORITHM:SHA256withRSA}